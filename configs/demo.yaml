enemy_color: "red"
#enemy_color: "blue"


#####-----神经网络参数-----#####
yolo_name: yolov5
classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: CPU
min_confidence: 0.8
use_traditional: true

#输出分辨率为1440x1080
#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree
min_confidence: 0.8

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: -1 # degree -2.5
pitch_offset: -1.4 # degree 2
comming_angle: 60 # degree
leaving_angle: 20 # degree
decision_speed: 8 # rad/s
high_speed_delay_time: 0.030 # s
low_speed_delay_time: 0.015 # s

#####-----shooter参数-----#####
first_tolerance: 5 # 近距离射击容差，degree
second_tolerance: 4 # 远距离射击容差，degree
judge_distance: 4 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击
use_gimbal_feedback: false # 无 IMU 时 false，仅凭指令稳定判定开火；有 IMU 时 true

camera_name: "hikrobot"
exposure_ms: 2
gain: 16
vid_pid: "2bdf:0001"

# -1  0  0
#  0 -1  0
#  0  0  1
R_gimbal2imubody: [-1, 0, 0, 0, -1, 0, 0, 0, 1]

# 重投影误差: 0.2697px
camera_matrix: [2308.72631, 0, 738.39422, 0, 2308.31509, 601.2956, 0, 0, 1]
distort_coeffs: [-0.062052, 0.014239, 0.004172, -0.000216, 0.000000]

# 相机同理想情况的偏角: yaw0.46 pitch0.61 roll-1.53 degree
R_camera2gimbal: [-0.0083195760046954614, 0.010498791137270739, 0.99991027599468041, -0.99960756138647755, -0.026835747568381807, -0.0080352891314148939, 0.026748978935305992, -0.99958472279097077, 0.010717933047771133]
t_camera2gimbal: [0.094969301833534511, 0.095006290298006682, 0.050987066291756609]

#####-----自瞄输出模式-----#####
aim_mode: "delta"     # "delta" = 无IMU/无弹道，仅发 yaw/pitch 差值(内参+像点)；"absolute" = 预测+弹道绝对角
# 枪口相对相机光轴的偏移（度），需自行调试后填入；开火判定以枪口对准为准（即发送的 command 为枪口差值）
gun_yaw_offset: 3.5      # degree，枪口在相机 yaw 方向偏移，正=枪口在相机右侧
gun_pitch_offset: 2.2  # degree，枪口在相机 pitch 方向偏移，正=枪口在相机上方

#####-----cboard参数-----#####
can_disabled: false    # 无 CAN 时 true；接上达妙后改为 false
can_send_only: true    # 仅上位机发送给电控，不等待四元数/弹速等反馈（单向通信）
can_send_hz: 100.0     # CAN 发送频率（Hz），0 或缺失=按图像帧率发送
quaternion_canid: 0x100
bullet_speed_canid: 0x101
send_canid: 0x105
# "damiao" = 达妙 SDK 直连 DM-USB2FDCAN，无需 slcand；否则填 SocketCAN 接口名如 can0/slcan0
can_interface: "damiao:2"

#####-----gimbal参数-----#####
com_port: "/dev/gimbal"

#####-----planner-----#####
fire_thresh: 0.003

max_yaw_acc: 50
Q_yaw: [9e6, 0]
R_yaw: [1]

max_pitch_acc: 100
Q_pitch: [9e6,0]
R_pitch: [1]

#####-----buff_detector参数-----#####
detect:
  contrast: 1
  brightness: 
    blue: -120
    red: -100
  brightness_threshold:
    blue: 120
    red: 40
  morphology_size:
    blue: 3
    red: 3
  dilate_size: 2
  # canny_low_threshold: 100
  # canny_high_threshold: 180
  # approx_epsilon: 1.0
  R_contours_min_area: 200
  R_contours_max_area: 600
  fanblades_head_contours_min_area: 3000
  fanblades_head_contours_max_area: 8000
  fanblades_body_contours_min_area: 1000
  fanblades_body_contours_max_area: 4000
  standard_fanblade_path: ./assets/standard_fanblade.jpg

#####-----buff_aimer参数-----#####
aim_time: 0.150         # s
wait_time: 0.300        # s
command_fire_gap: 0.080 # s
predict_time: 0.150     # s